app:
  database:
    # 标记当前数据库方言，供 SQL 初始化脚本与 DataSQL 生成逻辑复用。
    platform: postgresql

spring:
  datasource:
    # PostgreSQL 连接信息默认从环境变量读取，可按环境在 Nacos 中继续覆盖。
    url: ${POSTGRESQL_URL:jdbc:postgresql://127.0.0.1:5432/${app.database.name}}
    username: ${POSTGRESQL_USERNAME:postgres}
    password: ${POSTGRESQL_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      # PostgreSQL 环境默认不执行通用初始化脚本，避免误跑非目标库脚本。
      mode: never
