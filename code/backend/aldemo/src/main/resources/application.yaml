spring:
  application:
    # 应用名同时作为 Nacos 默认服务名和远端配置 dataId 前缀。
    name: aldemo
  profiles:
    # 运行时默认同时启用“环境 profile + 数据库 profile”。
    active: dev,mysql
  cloud:
    nacos:
      # Nacos 地址与账号属于应用启动前必须知道的引导配置，继续保留在本地。
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        # 服务注册默认与配置中心使用同一套 namespace / group，减少环境切换时的分叉。
        namespace: ${NACOS_NAMESPACE:aldemo}
        group: ${NACOS_GROUP:nacos}
        service: ${spring.application.name}
        # 默认本地不依赖 Nacos 注册中心，可通过环境变量 NACOS_DISCOVERY_ENABLED=true 或在 prod profile 开启。
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        register-enabled: ${NACOS_REGISTER_ENABLED:false}
      config:
        # 远端配置统一读取 ${spring.application.name}.yaml，环境差异放在该文件的 profile 分段中维护。
        namespace: ${NACOS_NAMESPACE:aldemo}
        group: ${NACOS_GROUP:nacos}
        file-extension: yaml
        refresh-enabled: true
        # 默认本地不拉 Nacos 远端配置；如需开启，可设置 NACOS_CONFIG_ENABLED=true。
        enabled: ${NACOS_CONFIG_ENABLED:false}
        import-check:
          enabled: false
    # Spring Cloud Commons 统一注册开关：默认关闭自动注册，避免本地无 Nacos 时因无法注册而启动失败。
    service-registry:
      auto-registration:
        enabled: ${SERVICE_REGISTRY_AUTO_REGISTRATION:false}
    discovery:
      enabled: ${SERVICE_DISCOVERY_ENABLED:false}

  sql:
    init:
      # 初始化脚本按数据库类型分目录加载，便于 test + mysql 等组合 profile 复用。
      schema-locations: classpath:db/${app.database.platform}/schema.sql
      data-locations: classpath:db/${app.database.platform}/data.sql

logging:
  pattern:
    # 统一打印 traceId，便于排查一次请求在各层日志中的完整链路。
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-}] %logger{36} - %msg%n"
  level:
    # 当 Nacos 关闭时，client 端的重试日志会刷屏；统一收敛为 OFF。
    com.alibaba.nacos: ${NACOS_CLIENT_LOG_LEVEL:OFF}

mybatis-plus:
  # Mapper 扫描与别名包属于稳定基础设施配置，保留在本地以保证无 Nacos 时也能启动。
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.hk.demo.app.model.dataobject
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

app:
  database:
    # 数据库平台主要由 application-mysql/oracle/postgresql.yaml 覆盖，这里提供本地默认值。
    platform: mysql
    # 默认库名作为本地兜底值，环境差异建议优先放到 Nacos。
    name: aldemo

---
spring:
  config:
    activate:
      on-profile: dev
  cloud:
    nacos:
      # 本地开发默认不依赖 Nacos，便于在没有 Nacos 服务时单机启动；
      # 如需联调注册中心或配置中心，可设置 NACOS_DISCOVERY_ENABLED / NACOS_CONFIG_ENABLED 环境变量。
      discovery:
        enabled: false
        register-enabled: false
      config:
        enabled: false
        import-check:
          enabled: false
